{% extends "books/base.html" %}

{% block title %} Delete {{ book.title }} - Eon{% endblock %}

{% block content %}
    <h2>
        Delete Book
    </h2>

    <p>
        Are you sure you want to Delete
        <strong>
            {{ book.title }}
        </strong>?
    </p>

    <form method="post" class="delet-form">
        {% csrf_token %}

        <button type="submit" class="danger-button">Yes, Delete</button>
        <a href="{% url 'books:book_detail' book.pk %}">Cancel</a>
    </form>
{% endblock %}
