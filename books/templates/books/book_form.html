{% extends "books/base.html" %}

{% block title %}Add Book - Eon{% endblock %}

{% block content %}
    <h2>Add Book</h2>

    <p class="helper-note">
        Want to add a book faster?
        <a href="{% url 'books:google_book_search' %}">Search Google Books</a>
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Book</button>
    </form>
{% endblock %}
